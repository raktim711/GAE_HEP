name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: lint + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install CPU-only torch (version from constraints.txt)
        # `torch==X` in constraints.txt has no local label, so the CPU wheel X+cpu satisfies it (PEP 440)
        # and the next step keeps it instead of pulling the CUDA build from PyPI.
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch -c constraints.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Install gaehep with the pinned dependencies
        run: python -m pip install -e ".[dev]" -c constraints.txt
      - name: Check that the CPU torch build was kept
        run: python -c "import torch; print(torch.__version__); assert torch.__version__.endswith('+cpu')"
      - name: ruff check
        run: ruff check src tests scripts
      - name: ruff format --check
        run: ruff format --check src tests scripts
      - name: pytest
        run: python -m pytest -m "not slow" -p no:warnings

  smoke:
    name: make smoke (synthetic end-to-end run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install CPU-only torch (version from constraints.txt)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch -c constraints.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Install gaehep with the pinned dependencies
        run: python -m pip install -e ".[dev]" -c constraints.txt
      - name: make smoke
        run: make PY=python smoke
