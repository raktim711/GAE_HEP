model: set_ae
model_args:
  hidden:
  - 48
  - 48
  - 48
  k: 12
  latent_dim: 8
  n_out: 50
  dec_hidden:
  - 256
  - 256
  lambda_mult: 0.1
data:
  n_const: 50
train:
  epochs: 25
  jets_per_epoch: 200000
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  patience: 5
  time_budget_min: 100
  seed: 1
