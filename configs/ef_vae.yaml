# Final model: energy-flow graph *variational* autoencoder with a 4-d jet latent (best of latent 2 / 4 / 8 on
# the dev split with single seeds; latent 2 is within the seed spread). The VAE's KL term is a second,
# density-like score (weak at latent 4, strong at latent 8). Scores: energy-MMD
# reconstruction ("score"), KL divergence of the jet posterior ("+kl", extra_scores), and their
# rank ensemble (gaehep ensemble ef_vae ef_vae+kl --out ef_vae+ens).  The reported models were trained with
# `gaehep dev configs/ef_vae.yaml --name <dev run> --set train.seed=<s>` and scored on the test splits with
# `gaehep promote <dev run> ef_vae_s<s>`; `gaehep train configs/ef_vae.yaml` uses the same budget.
model: ef_ae
model_args:
  hidden: [48, 48, 48]
  k: 12
  latent_dim: 4
  n_out: 32
  dec_hidden: [256, 256]
  sigmas: [0.02, 0.05, 0.1, 0.2, 0.4]
  variational: true
  beta: 0.001
extra_scores: [kl]
data:
  n_const: 50
train:                      # = the dev-protocol budget (gaehep dev); longer training lowered the dev AUC
  epochs: 5
  jets_per_epoch: 120000
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 1.0e-4
  patience: 3
  val_jets: 20000
  time_budget_min: 100
  threads: 1
  seed: 1
