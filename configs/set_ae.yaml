# M2: graph-level set autoencoder (main model). Score = Chamfer reconstruction + 0.1 x multiplicity error.
model: set_ae
model_args:
  hidden: [48, 48, 48]      # EdgeConv widths (dynamic k-NN after the first block)
  k: 12
  latent_dim: 8             # per-jet bottleneck
  n_out: 50                 # = data.n_const
  dec_hidden: [256, 256]
  lambda_mult: 0.1
data:
  n_const: 50               # top-50 constituents by pT per jet
train:
  epochs: 25
  jets_per_epoch: 200000
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 1.0e-4
  patience: 5
  time_budget_min: 100
  seed: 1
