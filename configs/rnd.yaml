# Random-network distillation (fixed-target score): a student EdgeConv network learns a frozen random
# teacher's embedding of background jets; score = student error.  See src/gaehep/models/rnd.py.
model: rnd
model_args:
  hidden: [48, 48, 48]
  teacher_hidden: [64, 64, 64]
  k: 8
  out_dim: 32
  head_hidden: [128]
data:
  n_const: 50
train:
  epochs: 2
  jets_per_epoch: 120000
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 1.0e-4
  patience: 3
  val_jets: 20000
  time_budget_min: 100
  threads: 1
  seed: 1
