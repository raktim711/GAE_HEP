# M2c: conditional set AE - decoder and multiplicity head also see the jet's (log m, log pT) -> mass-decorrelated score.
model: set_ae
model_args: {hidden: [48, 48, 48], k: 12, latent_dim: 8, n_out: 50, dec_hidden: [256, 256], lambda_mult: 0.1, cond_dim: 2}
data: {n_const: 50}
train: {epochs: 25, jets_per_epoch: 200000, batch_size: 256, lr: 1.0e-3, weight_decay: 1.0e-4, patience: 5, time_budget_min: 100, seed: 1}
