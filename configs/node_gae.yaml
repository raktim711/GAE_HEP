# M1: node-level GAE with a 2-d per-node bottleneck (corrected successor of the AIMS GAE).
model: node_gae
model_args: {enc_hidden: [48, 48], node_latent: 2, dec_hidden: [48, 48], k: 12}
data: {n_const: 50}
train: {epochs: 25, jets_per_epoch: 200000, batch_size: 256, lr: 1.0e-3, weight_decay: 1.0e-4, patience: 5, time_budget_min: 100, seed: 1}
